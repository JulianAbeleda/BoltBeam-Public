[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boltbeam"
version = "0.3.20"
description = "Audit where inference time goes against a measured roofline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "BoltBeam contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4"]
qualification = ["numpy>=1.26"]

[project.scripts]
boltbeam = "boltbeam.cli:main"

# Only the boltbeam package ships. tui/, gui/, bench/ and schemas/ are repo folders, not Python packages.
[tool.setuptools.packages.find]
include = ["boltbeam*"]

# The code reads these files next to its own modules at run time, so the wheel must carry them.
[tool.setuptools.package-data]
boltbeam = ["policy/assets/*.json", "policy/assets/*.sha256", "data/*.json", "data/*.jsonl", "collectors/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

markers = [
  "hardware: live GPU qualification (requires --hardware)",
  "integration: optional checkout or external evidence (requires --integration)",
]
